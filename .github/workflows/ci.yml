name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Storybook tests in `pnpm test` run in Vitest browser mode on Playwright Chromium.
      - run: pnpm --filter @lukas/web exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      # Integration tests start Postgres with testcontainers (Docker is available on the runner).
      - run: pnpm test
