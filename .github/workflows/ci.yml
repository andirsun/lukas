name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Storybook tests in `pnpm test` run in Vitest browser mode on Playwright Chromium.
      - run: pnpm --filter @lukas/web exec playwright install --with-deps chromium
      - run: pnpm lint
      # Generated files must be committed as generated. tokens.css comes from the design system's
      # tokens.json: run `pnpm --filter @lukas/web tokens` and commit it.
      - run: pnpm --filter @lukas/web tokens
      - run: git diff --exit-code apps/web/app/styles/tokens.css
      # The web's API types are generated from the API's OpenAPI document (built from the app, no
      # server or database). Fails when apps/web/app/api/schema.d.ts is stale: run
      # `pnpm --filter @lukas/web api:types` (with the API running) or add --file, and commit it.
      - run: pnpm --filter @lukas/web api:types --file
      - run: git diff --exit-code apps/web/app/api/schema.d.ts
      - run: pnpm typecheck
      # Unit, API integration and Storybook tests. Integration tests start Postgres with
      # testcontainers (Docker is available on the runner); the Storybook stories run after them in
      # Chromium (apps/web/vitest.config.ts).
      - run: pnpm test
      # The personal install's backup retention (no dump older than 14 days), on fake dumps.
      - run: deploy/personal/test-retention.sh

  e2e:
    runs-on: ubuntu-latest
    env:
      # The suite's "now" (apps/web/e2e/helpers.ts): the API's clock is pinned to it.
      E2E_NOW: "2026-10-21T15:00:00Z"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lukas/web exec playwright install --with-deps chromium
      # The dev stack: Postgres, Mailpit and the API (which applies the migrations on start), with
      # the development defaults. The e2e's global setup waits for the API and Mailpit.
      - run: cp .env.example .env
      - run: docker compose up -d --build
      # App flows against `pnpm dev` (Playwright starts it) and the stack, at phone and desktop
      # sizes, axe on every screen included.
      - run: pnpm --filter @lukas/web e2e
      - if: failure()
        run: docker compose logs api
      # The landing as it ships, built three ways: the full site, the landing-only release without
      # an app, and the landing-only release with one. Each script builds first.
      - run: pnpm --filter @lukas/web e2e:landing
      - run: pnpm --filter @lukas/web e2e:landing-only
      - run: pnpm --filter @lukas/web e2e:landing-only-app
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7

  # Publishes the landing (lukitas.andersonlaverde.com, docs/deploy/landing.md) after every merge
  # into main, once both jobs above pass: what is on main is what the site shows. Pull requests
  # never get here, so they never touch the live site. Needs two repository secrets, set by the
  # owner: CLOUDFLARE_API_TOKEN (Cloudflare template "Edit Cloudflare Workers", limited to the
  # account that holds andersonlaverde.com) and CLOUDFLARE_ACCOUNT_ID.
  deploy-landing:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    # One publish at a time; a newer merge waits for the one in flight instead of racing it.
    concurrency:
      group: deploy-landing
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (docs/deploy/landing.md, 'Publishing on merge')."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The landing-only release, built as docs/deploy/landing.md says.
      - run: pnpm --filter @lukas/web build:landing
        env:
          VITE_SITE_URL: https://lukitas.andersonlaverde.com
          VITE_APP_URL: https://app-lukas.andersonlaverde.com
      # From deploy/landing, so wrangler reads its config there and does not auto-configure the app.
      - run: npx --yes wrangler@4.151.3 deploy
        working-directory: deploy/landing
