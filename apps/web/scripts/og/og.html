<!doctype html>
<!--
  Template for the 1200×630 Open Graph images (public/og-es.png, og-en.png, og-it.png, og-pt.png). Rendered by
  render.ts, which fills the [data-copy] elements from the message catalogs (rich-text tags such as
  <mark> become <span class="rich-mark">). Colors come from the
  app's tokens (night theme), fonts from the self-hosted Fontsource files, Lukitas is one frame of
  the wave sprite.
-->
<html lang="es" data-theme="night">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../app/styles/tokens.css" />
    <style>
      @font-face {
        font-family: "Fredoka";
        font-weight: 600;
        src: url("../../node_modules/@fontsource/fredoka/files/fredoka-latin-600-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Fredoka";
        font-weight: 700;
        src: url("../../node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Nunito";
        font-weight: 800;
        src: url("../../node_modules/@fontsource/nunito/files/nunito-latin-800-normal.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        display: grid;
        grid-template-columns: 1fr 470px;
        align-items: center;
        box-sizing: border-box;
        padding: 0 40px 0 80px;
        background: radial-gradient(120% 90% at 70% 0%, var(--bg-glow) 0%, var(--bg) 62%);
        color: var(--ink);
        font-family: var(--font-text);
      }
      .logo {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 60px;
        line-height: 1;
        background: linear-gradient(90deg, var(--gold), var(--candy));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .headline {
        margin: 44px 0 0;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 74px;
        line-height: 1.04;
        color: var(--good);
        text-shadow: 0 0 26px color-mix(in srgb, var(--good) 30%, transparent);
      }
      /* The highlighted word: dark ink on the gold marker blob. */
      .rich-mark {
        display: inline-block;
        margin-inline: -0.04em;
        padding: 0 0.16em 0.06em;
        border-radius: 0.5em 0.28em 0.6em 0.22em / 0.38em 0.6em 0.3em 0.55em;
        background: var(--gold);
        box-shadow: 0.05em 0.07em 0 color-mix(in srgb, var(--gold) 45%, transparent);
        color: var(--on-gold);
        text-shadow: none;
        transform: rotate(-2deg);
      }
      .perks {
        margin: 26px 0 0;
        font-size: 22px;
        font-weight: 800;
        color: var(--ink-muted);
      }
      .mascot {
        position: relative;
        width: 470px;
        height: 470px;
      }
      .mascot::before {
        content: "";
        position: absolute;
        inset: 2%;
        border-radius: 50%;
        background: radial-gradient(
          closest-side,
          color-mix(in srgb, var(--gold) 38%, transparent),
          color-mix(in srgb, var(--brand-glow) 18%, transparent) 62%,
          transparent
        );
      }
      /* Frame 3 of the 4×2 wave sheet (arm up): column 3 of 4, first row. */
      .mascot::after {
        content: "";
        position: absolute;
        inset: 0;
        background: url("../../public/lukas/wave.webp") 66.667% 0% / 400% 200% no-repeat;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div>
        <div class="logo">Lukitas</div>
        <div class="headline" data-copy="hero.headline"></div>
        <div class="perks" data-copy="hero.perks"></div>
      </div>
      <div class="mascot"></div>
    </div>
  </body>
</html>
