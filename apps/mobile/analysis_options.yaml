# The analyzer and lint settings `flutter analyze` applies (CI runs it).
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    # Generated by scripts/gen-api.sh (openapi-generator dart-dio and built_value). Not edited by
    # hand, so not linted; the app code that calls it still is.
    - lib/api/gen/**

formatter:
  # The repo's line width (biome.json).
  page_width: 100

linter:
  rules:
    - prefer_single_quotes
