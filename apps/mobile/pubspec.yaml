name: lukitas
description: "Lukitas, a free-software personal-finance app."
publish_to: "none"

# The dev build's versionName and base versionCode. Release builds are given theirs from the
# mobile-v* tag with --build-name and --build-number (scripts/release.sh, docs/mobile/release.md).
version: 0.0.0-dev+1

environment:
  sdk: ^3.13.5

# Direct dependencies are pinned to exact versions at least two weeks old, and every one is
# free-licensed. No Google Play Services or Firebase package, ever: scripts/check-no-google.sh
# fails the build on them.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # The generated API client (lib/api/gen) needs dio, built_value, built_collection and one_of.
  built_collection: 5.1.2
  built_value: 8.13.0
  # SHA-256 of the session token, which binds the home cache to its session (lib/home/home_cache.dart).
  # BSD-3-Clause, from the Dart team; already in the app through other packages.
  crypto: 3.0.7
  dio: 5.11.1
  flutter_riverpod: 3.4.3
  # The session's bearer token, encrypted with a key kept in the Android Keystore (spec section
  # 6.3). BSD-3-Clause; on Android it brings Tink (Apache-2.0), and its Windows side brings
  # path_provider and jni into the APK. No Play Services.
  flutter_secure_storage: 11.2.0
  go_router: 18.0.2
  # Hands the home snapshot to the Android widget (Kotlin, Jetpack Glance) through
  # SharedPreferences, with no Flutter engine running (spec section 7.1). BSD-3-Clause; on Android
  # it brings AndroidX Glance, WorkManager and kotlinx-coroutines only. No Play Services.
  home_widget: 0.10.0
  # The version flutter_localizations pins.
  intl: 0.20.3
  one_of: 1.5.0
  one_of_serializer: 1.5.0
  # Time zone rules for the profile's "today" (lib/capture/parser/dates.dart), from the bundled
  # database, with no network. BSD-2-Clause.
  timezone: 0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device tests against the dev stack (integration_test/).
  integration_test:
    sdk: flutter
  # Generates the API client's *.g.dart files (scripts/gen-api.sh).
  build_runner: 2.16.2
  built_value_generator: 8.13.0
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  # AppLocalizations from lib/l10n (l10n.yaml).
  generate: true
  assets:
    # Lukitas' sprite sheets, the web's own (apps/web/public/lukas): 4x2 frames of 500 px.
    - assets/lukas/wave.webp
    - assets/lukas/celebrate.webp
    - assets/lukas/worried.webp
    # The web's feedback sounds (apps/web/app/feedback/sounds), original work; see assets/sounds/README.md.
    # SoundChannel.kt plays them with Android's SoundPool.
    - assets/sounds/expense-saved.mp3
    - assets/sounds/income-saved.mp3
    - assets/sounds/near-limit.mp3
    - assets/sounds/over-budget.mp3
    - assets/sounds/paid.mp3
    - assets/sounds/tap.mp3
    - assets/sounds/undo.mp3
    # Licence texts About lists next to the packages' (lib/settings/licenses.dart): the Apache 2.0
    # of the voice models and the Android libraries, the AGPL 3.0 of the app and its sounds, the
    # BSD-3-Clause text published inside one AndroidX Glance library, and what the native libraries
    # of Vosk and JNA carry inside: OpenBLAS (BSD-3-Clause), CLAPACK (BSD) with libf2c's notice, and
    # libffi (MIT), each as its project publishes it.
    - assets/licenses/apache-2.0.txt
    - assets/licenses/agpl-3.0.txt
    - assets/licenses/glance-protobuf-bsd-3-clause.txt
    - assets/licenses/openblas-bsd-3-clause.txt
    - assets/licenses/clapack-bsd.txt
    - assets/licenses/libf2c-notice.txt
    - assets/licenses/libffi-mit.txt
    # Generated by scripts/gen-android-licenses.dart from the release classpath's POMs.
    - assets/licenses/android-libraries.json
    # The OFL.txt of each bundled font, as its project publishes it; About lists them next to the
    # packages' (lib/settings/licenses.dart) and scripts/check-licenses.sh checks every font has one.
    - assets/fonts/Fredoka-OFL.txt
    - assets/fonts/Nunito-OFL.txt
  # The web's two fonts (apps/web/app/styles/tokens.css --font-display, --font-text), bundled so the
  # app never fetches one: Fredoka (display) and Nunito (text), both SIL OFL 1.1. Each file is the
  # variable font Google Fonts publishes (google/fonts, ofl/fredoka and ofl/nunito, commit
  # e7db6ca603fd), unmodified, so every weight the web loads (apps/web/app/styles/fonts.ts: Fredoka
  # 500-700, Nunito 600-900) is drawn from the one file. See assets/fonts/README.md.
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Variable.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
