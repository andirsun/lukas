<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  html, body { margin: 0; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--bg); }
  .cover svg { position: absolute; inset: 0; }
  .brand { fill: var(--brand); } .brand-edge { fill: var(--brand-edge); }
  .good { fill: var(--good); } .gold { fill: var(--gold); } .candy { fill: var(--candy); }
  .glow { fill: var(--bg-glow); } .track { fill: var(--ink); opacity: .14; }
  .slab { rx: var(--radius-xl); } .pill { rx: var(--radius-pill); }
  .name { position: absolute; left: 48px; bottom: 76px; font-family: var(--font-display); font-weight: 700; font-size: 120px; line-height: .92; color: var(--ink); margin: 0; }
  .tag { position: absolute; left: 50px; bottom: 44px; max-width: 440px; font-family: var(--font-text); font-weight: 800; font-size: 14px; color: var(--ink-muted); margin: 0; }
</style></head>
<body>
<div class="cover">
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <!-- blocks: brand slab 220x210 (radius-xl) on a 10px brand-edge, gold disc r56, bg-glow slab 150x120, candy disc r22 -->
    <!-- arrangement: one tall brand slab bleeding off the top-right, satellites to its left, all right of x=480 -->
    <!-- pattern: pills from radius-pill as budget bars (track ink 14 %, fills in good) because the system's signature is bars that fill and rounded pressable shapes -->
    <!-- steps/radii: space-4 (16) gaps, space-5 (24) between bars, radius-xl slabs, radius-pill bars -->
    <rect class="glow slab" x="528" y="-24" width="150" height="120"/>
    <rect class="brand-edge slab" x="700" y="-20" width="220" height="210"/>
    <rect class="brand slab" x="700" y="-30" width="220" height="210"/>
    <circle class="gold" cx="612" cy="132" r="56"/>
    <circle class="candy" cx="540" cy="160" r="22"/>
    <rect class="track pill" x="520" y="214" width="420" height="14"/>
    <rect class="good pill" x="520" y="214" width="170" height="14"/>
    <rect class="track pill" x="520" y="238" width="420" height="14"/>
    <rect class="good pill" x="520" y="238" width="356" height="14"/>
    <rect class="track pill" x="520" y="262" width="420" height="14"/>
    <rect class="good pill" x="520" y="262" width="252" height="14"/>
  </svg>
  <h1 class="name">Lukas</h1>
  <p class="tag">Tus lukas, por fin claras. Gratis para siempre y de código abierto.</p>
</div>
</body>
</html>
