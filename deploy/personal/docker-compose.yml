# Personal install of Lukitas: its own stack on one machine, reached through a Cloudflare tunnel.
# Not the development stack (../../docker-compose.yml): different project, volume, network and
# database, nothing shared with it. Run it with the scripts here (up.sh, update.sh, ...), which pass
# the right --env-file. See README.md.
#
#   Cloudflare ──tunnel──> cloudflared ──> web (Caddy) ──/api/*──> api ──> postgres
#                                           └─ static app and landing
#
# Only web publishes a port, on 127.0.0.1, for checking from this machine. Postgres and the API are
# reachable from inside this stack's network only.
name: lukitas-personal

# Container logs stay small: three files of 10 MB per service.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: lukitas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: lukitas
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lukitas -d lukitas"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the lukas_app role (password from .env) and applies the migrations as the
  # database owner. Safe to run again. The API starts only after it exits 0.
  migrate: &api-image
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.prod
    image: lukitas-api:personal
    command: ["node", "dist/bootstrap.js"]
    restart: "no"
    logging: *logging
    environment:
      DATABASE_ADMIN_URL: postgres://lukitas:${POSTGRES_PASSWORD}@postgres:5432/lukitas
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api-image
    command: ["node", "dist/server.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      # The runtime role: subject to row-level security. The owner credential stays in `migrate`.
      DATABASE_URL: postgres://lukas_app:${APP_DB_PASSWORD}@postgres:5432/lukitas
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      # One hostname for the app and the API, so the session cookie is first-party. The API serves
      # every route under /api. The passkey rpID is this hostname: keep it if you move the install.
      API_URL: https://${PUBLIC_HOSTNAME:-app-lukas.andersonlaverde.com}/api
      WEB_URL: https://${PUBLIC_HOSTNAME:-app-lukas.andersonlaverde.com}
      MAIL_FROM: ${MAIL_FROM:-Lukitas <hola@andersonlaverde.com>}
      # Exactly one of these two (the API refuses to start otherwise): Proton Bridge on this Mac,
      # or Resend on a server.
      SMTP_URL: ${SMTP_URL:-}
      SMTP_TLS_INSECURE: ${SMTP_TLS_INSECURE:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SIGN_IN_ALLOWLIST: ${SIGN_IN_ALLOWLIST:?Set SIGN_IN_ALLOWLIST in .env}
      # Caddy puts the client address Cloudflare reports into X-Forwarded-For. Only that hop is
      # trusted: Caddy's fixed address in this network.
      CLIENT_IP_HEADER: x-forwarded-for
      TRUSTED_PROXIES: ${NETWORK_PREFIX:-172.28.77}.10
      HEALTH_PATH: /api/health
    extra_hosts:
      # Docker Desktop defines host.docker.internal; on Linux this line does (Proton Bridge, Mailpit).
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  # Caddy with the static app baked in (up.sh builds it into apps/web/build-personal first), and
  # /api/* sent to the API. A new build is a new image, so an update replaces the container.
  web:
    build:
      context: ../..
      dockerfile: deploy/personal/Dockerfile.web
    image: lukitas-web:personal
    restart: unless-stopped
    logging: *logging
    environment:
      # Where `/`, `/en` and the roadmap redirect: the public landing site.
      LANDING_URL: ${LANDING_URL:-https://lukitas.andersonlaverde.com}
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    networks:
      default:
        ipv4_address: ${NETWORK_PREFIX:-172.28.77}.10
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/sign-in"]
      interval: 10s
      timeout: 3s
      retries: 6

  # The tunnel (outbound only: nothing on this machine listens to the internet). Its credentials
  # file is mounted read-only; ingress is in cloudflared.yml. Skipped by `up.sh --no-tunnel`.
  # (up.sh checks TUNNEL_ID and the credentials file before it starts this.)
  cloudflared:
    image: cloudflare/cloudflared:2026.10.3
    restart: unless-stopped
    logging: *logging
    command:
      - tunnel
      - --no-autoupdate
      - --config
      - /etc/cloudflared/config.yml
      - --credentials-file
      - /etc/cloudflared/credentials.json
      - run
      - ${TUNNEL_ID:-}
    volumes:
      - ./cloudflared.yml:/etc/cloudflared/config.yml:ro
      - ${CLOUDFLARED_DIR:-${HOME}/.cloudflared}/${TUNNEL_ID:-}.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      web:
        condition: service_healthy

networks:
  default:
    ipam:
      config:
        - subnet: ${NETWORK_PREFIX:-172.28.77}.0/24

volumes:
  db:
    # External: created by up.sh, not owned by this project, so `docker compose down -v` cannot
    # delete it. A fixed name, so the data does not depend on the project name. (Docker Desktop's
    # "Clean / Purge data" would still delete every volume: see README, Backup.)
    external: true
    name: ${DB_VOLUME_NAME:-lukitas-personal-db}
