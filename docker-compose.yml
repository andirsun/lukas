services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lukas
      POSTGRES_PASSWORD: lukas
      POSTGRES_DB: lukas
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lukas -d lukas"]
      interval: 2s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://lukas_app:lukas_app@postgres:5432/lukas
      DATABASE_ADMIN_URL: postgres://lukas:lukas@postgres:5432/lukas
      SMTP_URL: smtp://mailpit:1025
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  postgres-data:
